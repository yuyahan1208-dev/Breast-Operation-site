                                        <p className="text-lg text-stone-500 font-medium">了解術前檢查、飲食建議與外觀準備等重要事項。</p>
                                    </div>
                                    <div className="relative z-10 mt-8 flex justify-end">
                                        <div className="w-10 h-10 rounded-full bg-rose-500 text-white flex items-center justify-center group-hover:scale-110 transition-transform">
                                            <i className="fa-solid fa-arrow-right"></i>
                                        </div>
                                    </div>
                                </button>

                                {/* 手術後按鈕 */}
                                <button 
                                    onClick={() => handleNavigate('post')}
                                    className="group relative bg-white rounded-[2rem] p-8 md:p-12 shadow-lg hover:shadow-2xl transition-all duration-300 border-2 border-transparent hover:border-teal-200 text-left overflow-hidden flex flex-col justify-between min-h-[240px]"
                                >
                                    <div className="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity">
                                        <i className="fa-solid fa-heart-pulse text-8xl text-teal-500"></i>
                                    </div>
                                    <div className="relative z-10 space-y-4">
                                        <div className="w-16 h-16 rounded-2xl bg-teal-100 text-teal-500 flex items-center justify-center text-3xl mb-6">
                                            <i className="fa-solid fa-house-medical-circle-check"></i>
                                        </div>
                                        <h2 className="text-3xl md:text-4xl font-bold text-stone-800">手術後照護</h2>
                                        <p className="text-lg text-stone-500 font-medium">掌握傷口照護、復健時機與返家後的日常須知。</p>
                                    </div>
                                    <div className="relative z-10 mt-8 flex justify-end">
                                        <div className="w-10 h-10 rounded-full bg-teal-500 text-white flex items-center justify-center group-hover:scale-110 transition-transform">
                                            <i className="fa-solid fa-arrow-right"></i>
                                        </div>
                                    </div>
                                </button>
                            </div>
                        </div>
                    )}

                    {view === 'pre' && <PreSurgeryView onNavigate={handleNavigate} />}
                    {view === 'post' && <PostSurgeryView onNavigate={handleNavigate} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
